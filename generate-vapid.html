<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harris Livescore VAPID Generator</title>
</head>
<body>
    <h2>Harris Livescore 🔔</h2>
    <h3>VAPID Key Generator</h3>

    <button id="generate">Generate Valid Keys</button>

    <p>Public Key</p>
    <textarea id="publicKey" rows="5" style="width:95%"></textarea>

    <p>Private Key</p>
    <textarea id="privateKey" rows="5" style="width:95%"></textarea>

    <script>
        function base64url(bytes) {
            let binary = "";
            bytes.forEach(b => {
                binary += String.fromCharCode(b);
            });

            return btoa(binary)
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }

        document.getElementById("generate").onclick =
            async function () {
                try {
                    const keys = await crypto.subtle.generateKey(
                        {
                            name: "ECDH",
                            namedCurve: "P-256"
                        },
                        true,
                        ["deriveBits"]
                    );

                    const publicBytes = new Uint8Array(
                        await crypto.subtle.exportKey(
                            "raw",
                            keys.publicKey
                        )
                    );

                    const privateJwk =
                        await crypto.subtle.exportKey(
                            "jwk",
                            keys.privateKey
                        );

                    document.getElementById("publicKey").value =
                        base64url(publicBytes);

                    document.getElementById("privateKey").value =
                        privateJwk.d;

                } catch (error) {
                    alert("Key generation failed: " + error.message);
                }
            };
    </script>
</body>
</html>
